# Deploys the Plaid Cloud Functions.
# Manual-only for now (Actions tab -> Run workflow) so it can't fail-and-email
# before Blaze + the secrets exist. Once the first run is green we add a push
# trigger so deploys are automatic, like the site.
name: Deploy functions

on:
  workflow_dispatch:
    inputs:
      plaid_env:
        description: 'Which Plaid environment to talk to'
        type: choice
        default: sandbox
        options: [sandbox, production]
      redirect_uri:
        description: 'OAuth redirect URI (blank = send none; OAuth still works on web)'
        type: string
        default: 'https://jeells96.github.io/BudgetTracker/plaid-oauth.html'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        working-directory: functions
        run: npm install
      # Picked from the dropdown when you start the run, so switching between
      # fake sandbox data and your real accounts never needs a code change.
      - name: Set Plaid environment
        run: |
          echo "PLAID_ENV=${{ inputs.plaid_env }}" > functions/.env
          echo "PLAID_REDIRECT_URI=${{ inputs.redirect_uri }}" >> functions/.env
          cat functions/.env
      # Asks Plaid which environment these keys are for, before anything is
      # deployed. Cheaper than finding out from a broken Connect button.
      - name: Check the keys match the chosen environment
        env:
          CID: ${{ secrets.PLAID_CLIENT_ID }}
          SEC: ${{ secrets.PLAID_SECRET }}
          WANT: ${{ inputs.plaid_env }}
        run: |
          CID=$(printf '%s' "$CID" | tr -d '[:space:]')
          SEC=$(printf '%s' "$SEC" | tr -d '[:space:]')
          echo "client_id: ${#CID} chars, secret: ${#SEC} chars (Plaid uses 24 and 30)"
          probe () {
            curl -s -o /tmp/p.json -w '%{http_code}' -X POST "https://$1.plaid.com/institutions/get" \
              -H 'Content-Type: application/json' \
              -d "{\"client_id\":\"$CID\",\"secret\":\"$SEC\",\"count\":1,\"offset\":0,\"country_codes\":[\"US\"]}"
          }
          if [ "$(probe "$WANT")" = "200" ]; then
            echo "These keys are valid for $WANT."
            exit 0
          fi
          OTHER=production; [ "$WANT" = "production" ] && OTHER=sandbox
          if [ "$(probe "$OTHER")" = "200" ]; then
            echo "::error::PLAID_SECRET is your $OTHER secret, but you chose $WANT. Either re-run choosing $OTHER, or replace PLAID_SECRET with your $WANT secret from Plaid -> Build -> Keys."
          else
            echo "::error::Plaid rejected these keys in BOTH environments ($(jq -r '.error_code // \"no code\"' /tmp/p.json)). Recheck PLAID_CLIENT_ID and PLAID_SECRET in repo Settings -> Secrets and variables -> Actions."
          fi
          exit 1

      - name: Write service account
        run: |
          cat > "$RUNNER_TEMP/sa.json" <<'JSON'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JSON
      # Keeps Secret Manager as the only home for the Plaid keys, while GitHub
      # Secrets stays the only place you ever paste them. The deploy below then
      # binds whatever version this just wrote.
      - name: Sync Plaid keys into Secret Manager
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          CID: ${{ secrets.PLAID_CLIENT_ID }}
          SEC: ${{ secrets.PLAID_SECRET }}
        run: |
          set -e
          CID=$(printf '%s' "$CID" | tr -d '[:space:]')
          SEC=$(printf '%s' "$SEC" | tr -d '[:space:]')
          if [ -z "$CID" ] || [ -z "$SEC" ]; then
            echo "::error::Add PLAID_CLIENT_ID and PLAID_SECRET under Settings -> Secrets and variables -> Actions, then run this again."
            exit 1
          fi
          FB="npx --yes firebase-tools@latest"
          printf '%s' "$CID" | $FB functions:secrets:set PLAID_CLIENT_ID --project bestball-fantasy --data-file - --non-interactive
          printf '%s' "$SEC" | $FB functions:secrets:set PLAID_SECRET    --project bestball-fantasy --data-file - --non-interactive

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@latest deploy --only functions --project bestball-fantasy --non-interactive --force
